<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Repayment Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .card { background: #ffffff; width: 100%; max-width: 420px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); position: relative; }
        
        /* Top Bar & Timer */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; }
        .brand-title { font-size: 16px; font-weight: 700; color: #0f172a; }
        .timer-box { background: #fee2e2; color: #dc2626; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
        .timer-icon { width: 8px; height: 8px; background: #dc2626; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Payment Apps Logos */
        .apps-container { display: flex; justify-content: space-around; align-items: center; background: #f8fafc; padding: 12px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .app-logo { height: 26px; object-fit: contain; }

        .amount-box { text-align: center; margin: 15px 0 25px 0; background: #f8fafc; padding: 20px; border-radius: 14px; border: 1px solid #e2e8f0; }
        .amount-label { font-size: 13px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .amount-value { font-size: 32px; color: #0f172a; font-weight: 800; margin-top: 4px; }
        
        .info-group { margin-bottom: 16px; background: #ffffff; border: 1px solid #e2e8f0; padding: 12px 16px; border-radius: 12px; }
        .info-label { font-size: 12px; color: #64748b; font-weight: 600; margin-bottom: 4px; }
        .info-value { font-size: 15px; color: #1e293b; font-weight: 700; word-break: break-all; }
        
        .btn { background: #0062e6; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; text-decoration: none; display: block; text-align: center; box-shadow: 0 4px 12px rgba(0,98,230,0.25); transition: all 0.2s; }
        .btn:hover { background: #004bb5; }
        .btn.disabled { background: #94a3b8 !important; cursor: not-allowed; box-shadow: none; }
        
        .expired-msg { color: #dc2626; text-align: center; font-size: 14px; font-weight: 700; margin-top: 15px; display: none; }
        .footer-note { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Top Header & Countdown Timer -->
        <div class="top-bar">
            <div class="brand-title">Loan Repayment</div>
            <div class="timer-box" id="timer-box">
                <span class="timer-icon"></span>
                <span id="timer">10:00</span>
            </div>
        </div>

        <!-- Payment Apps Logos Header -->
        <div class="apps-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_%28GPay%29_Logo.svg" alt="GPay" class="app-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/71/PhonePe_Logo.svg" alt="PhonePe" class="app-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Paytm_Logo.svg" alt="Paytm" class="app-logo">
        </div>

        <div class="amount-box">
            <div class="amount-label">Total Payable Amount</div>
            <div class="amount-value" id="disp-amount">₹0.00</div>
        </div>

        <div class="info-group">
            <div class="info-label">Order Reference ID</div>
            <div class="info-value" id="disp-id">-</div>
        </div>

        <div class="info-group">
            <div class="info-label">Receiving UPI ID</div>
            <div class="info-value" id="disp-upi">-</div>
        </div>

        <a href="#" id="pay-btn" class="btn">Pay Now</a>
        <div id="expired-text" class="expired-msg">Payment link has expired! Please request a new link.</div>

        <div class="footer-note">Secure 256-bit Encrypted Payment Gateway</div>
    </div>

<script>
    // 10 Minutes Countdown Timer
    let timeLeft = 600; // 10 minutes in seconds
    const timerElem = document.getElementById('timer');
    const payBtn = document.getElementById('pay-btn');
    const expiredText = document.getElementById('expired-text');

    const countdown = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        
        timerElem.innerText = `${minutes}:${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerElem.innerText = "Expired";
            payBtn.classList.add('disabled');
            payBtn.removeAttribute('href');
            payBtn.innerText = "Link Expired";
            expiredText.style.display = "block";
        }
        timeLeft--;
    }, 1000);

    // Read payload from URL
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');

    if (dataParam) {
        try {
            const decoded = JSON.parse(atob(dataParam));
            const upi = decoded.upi || '';
            const amount = decoded.amount || '0';
            const id = decoded.id || '';

            document.getElementById('disp-amount').innerText = '₹' + parseFloat(amount).toLocaleString('en-IN', {minimumFractionDigits: 2});
            document.getElementById('disp-upi').innerText = upi;
            document.getElementById('disp-id').innerText = id;

            const upiUrl = `upi://pay?pa=${encodeURIComponent(upi)}&pn=Repayment&am=${encodeURIComponent(amount)}&cu=INR&tn=${encodeURIComponent('Loan Repayment ID ' + id)}`;
            
            payBtn.setAttribute('href', upiUrl);
        } catch (e) {
            console.error('Invalid URL Data');
        }
    }
</script>

</body>
</html>
